# ===== PROD (MySQL) =====
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false


app.rate-limit.general-per-minute=${RATE_LIMIT_GENERAL_PER_MINUTE:120}
app.rate-limit.preset-save-per-minute=${RATE_LIMIT_PRESET_SAVE_PER_MINUTE:20}
app.max-request-bytes=${MAX_REQUEST_BYTES:65536}
app.analytics.admin-key=${ANALYTICS_ADMIN_KEY:}
